name: jev
version: 0.2.0
description: Jev decisions and model routing for configured Hermes providers.
manifest_version: 1
license: MIT
author: Ourines
python_dependencies:
  - "httpx>=0.28,<0.29"
provides_tools:
  - jev_evaluate
  - jev_route
provides_hooks:
  - pre_model_route
  - pre_llm_call
  - post_llm_call
provides_middleware:
  - llm_request
config_schema:
  connection:
    type: dict
    default: {}
    description: Selected backend, model, provider routing identifiers and request timeout; no secrets.
  review_threshold:
    type: float
    description: Optional opt-in review heuristic; unset disables threshold gating. Not an authorization threshold.
  model_route_enabled:
    type: bool
    default: false
    description: When true, Jev automatically selects a Hermes model each user turn without an explicit jev_route call.
  model_routes:
    type: list
    default: []
    description: Optional non-secret model profiles; empty means discover configured authenticated providers.
  route_min_confidence:
    type: float
    description: Optional threshold for model routing; unset accepts a Jev choice but never authorizes execution.
